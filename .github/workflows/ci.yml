name: CPU correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libopenmpi-dev openmpi-bin
      - run: cmake -S . -B build && cmake --build build
      - run: OMP_NUM_THREADS=2 ctest --test-dir build --output-on-failure
